<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 8px; font: 14px system-ui, sans-serif; min-width: 180px; }
  label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  label:hover { background: #0000000f; }
  hr { margin: 6px 8px; border: 0; border-top: 1px solid #0000001f; }
  .note { margin: 6px 8px 0; max-width: 200px; font-size: 12px; opacity: .65; }
  @media (prefers-color-scheme: dark) {
    body { background: #2b2a33; color: #fbfbfe; }
    label:hover { background: #ffffff1a; }
    hr { border-top-color: #ffffff2e; }
  }
</style>
</head>
<body>
  <label><input type="radio" name="mode" value="chart">複合チャートのみ</label>
  <label><input type="radio" name="mode" value="other">複合チャート以外</label>
  <label><input type="radio" name="mode" value="all">すべて</label>
  <hr>
  <label><input type="checkbox" name="nosidebar">サイドバーを非表示</label>
  <label><input type="checkbox" name="noakawaku">赤枠を非表示</label>
  <label><input type="checkbox" name="notopmenu">トップメニューを非表示</label>
  <label><input type="checkbox" name="nolinkmenu">リンクメニューを非表示</label>
  <label><input type="checkbox" name="noheader">ヘッダーを非表示</label>
  <p class="note">このタブだけに効きます</p>
  <script src="popup.js"></script>
</body>
</html>
